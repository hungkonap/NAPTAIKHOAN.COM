name: Build NAPTAIKHOAN APK (SDK FIX)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='naptaikhoan_android_9.2.5_hoan_thien_project.zip'
          test -s "$ARCHIVE" || { echo "ERROR: ZIP not found at repository root: $ARCHIVE" >&2; exit 1; }
          unzip -tq "$ARCHIVE"
          mkdir -p android-project
          unzip -q "$ARCHIVE" -d android-project
          test -f android-project/app/build.gradle
          test -f android-project/build.gradle
          test -f android-project/settings.gradle
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/scripts/generate_assetlinks.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK without removed legacy tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36 and Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Ensure Android Browser Helper 2.7.4 compatible compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('android-project/app/build.gradle')
          root = Path('android-project/build.gradle')
          a = app.read_text(encoding='utf-8')
          r = root.read_text(encoding='utf-8')
          if "implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'" not in a:
              raise SystemExit('Unexpected app dependency; refusing to patch')
          if 'compileSdk 35' not in a or "version '8.7.3'" not in r:
              raise SystemExit('Unexpected project versions; refusing to patch')
          a = a.replace('compileSdk 35', 'compileSdk 36', 1)
          r = r.replace("version '8.7.3'", "version '8.9.2'", 1)
          app.write_text(a, encoding='utf-8')
          root.write_text(r, encoding='utf-8')
          print('compileSdk 36; targetSdk retained; Android Gradle Plugin 8.9.2')
          PY

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-project :app:assembleDebug --no-daemon --stacktrace

      - name: Validate APK, package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p artifact
          cp "$APK" artifact/NAPTAIKHOAN-TEST.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee artifact/apk-info.txt
          grep -q "package: name='com.naptaikhoan.app'" artifact/apk-info.txt
          grep -q "versionName='9.2.5'" artifact/apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee artifact/signature-check.txt
          FINGERPRINT=$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\1/p' artifact/signature-check.txt | head -1)
          test "${#FINGERPRINT}" -eq 64
          (cd android-project && python3 scripts/generate_assetlinks.py "$FINGERPRINT")
          cp android-project/assetlinks.json artifact/assetlinks-TEST.json
          python3 - <<'PY'
          import json
          obj = json.load(open('artifact/assetlinks-TEST.json', encoding='utf-8'))
          assert obj[0]['target']['package_name'] == 'com.naptaikhoan.app'
          assert len(obj[0]['target']['sha256_cert_fingerprints'][0].replace(':','')) == 64
          PY
          sha256sum artifact/NAPTAIKHOAN-TEST.apk > artifact/apk-sha256.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NAPTAIKHOAN-TEST-APK
          path: artifact/
          if-no-files-found: error
          retention-days: 14
