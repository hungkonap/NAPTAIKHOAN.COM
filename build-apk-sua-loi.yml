name: NAPTAIKHOAN APK FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 1 - Lay du an tren GitHub
        uses: actions/checkout@v4

      - name: 2 - Kiem tra va giai nen ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILES IN REPOSITORY ==='
          ls -lah
          ARCHIVE=$(find . -maxdepth 1 -type f -iname 'naptaikhoan_android*.zip' -print -quit)
          if [[ -z "$ARCHIVE" ]]; then
            echo 'ERROR: Khong tim thay file naptaikhoan_android*.zip o thu muc goc repo.' >&2
            exit 1
          fi
          echo "ZIP found: $ARCHIVE"
          unzip -t "$ARCHIVE" | tail -3
          mkdir -p android-project
          unzip -q "$ARCHIVE" -d android-project
          echo '=== PROJECT STRUCTURE ==='
          find android-project -maxdepth 3 -type f | sort | head -70
          if [[ ! -f android-project/app/build.gradle ]]; then
            echo 'ERROR: ZIP khong co app/build.gradle o cap goc.' >&2
            exit 1
          fi

      - name: 3 - Cai Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 4 - Cai Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 5 - Cai Android SDK
        uses: android-actions/setup-android@v3

      - name: 6 - Cai Android API 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: 7 - Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-project :app:assembleDebug --no-daemon --stacktrace

      - name: 8 - Luu APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cp android-project/app/build/outputs/apk/debug/app-debug.apk result/NAPTAIKHOAN-TEST.apk
          test -s result/NAPTAIKHOAN-TEST.apk
          sha256sum result/NAPTAIKHOAN-TEST.apk > result/sha256.txt

      - name: 9 - Tai APK ve
        uses: actions/upload-artifact@v4
        with:
          name: NAPTAIKHOAN-TEST-APK
          path: result/
          if-no-files-found: error
